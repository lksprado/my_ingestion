[project]
name = "my-ingestion"
version = "0.1.0"
description = "Monorepo de ingestão de dados pessoais (APIs, scraping) para Postgres/CSV/data lake local"
readme = "README.md"
authors = [{ name = "lksprado", email = "lks-prado@live.com" }]
# <3.13: o pipeline solar (Selenium/psycopg2) ainda não foi validado no 3.13
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.3",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.13",
    "unidecode>=1.4",
    "rapidfuzz>=3.13",
    "selenium>=4.30",
    "yfinance>=0.2.60",
    "gspread>=6.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
    "pre-commit>=4.3",
    "taskipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_ingestion"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Código de negócio migrado como estava (conformação, não reescrita):
# mensagens de log longas herdadas dos projetos originais.
"src/my_ingestion/pipelines/legislativo/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["integration: requer Postgres/serviços externos"]

[tool.taskipy.tasks]
lint = "ruff check . && ruff format --check ."
format = "ruff format . && ruff check --fix ."
test = "pytest -v -m 'not integration'"
