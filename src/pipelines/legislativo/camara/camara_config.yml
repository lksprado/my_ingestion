# Schema destino de todas as tabelas deste arquivo. Os nomes de tabela (db_table)
# preservam os que o my_analytics lê em _sources.yml; não renomeie.
# Sources por ID: base_url e landing_file usam o placeholder {id}; o CSV de
# parâmetros vem de parameter_file (coluna options.parameter_column, default id)
# e os IDs sem resposta ficam em options.no_data_file (ver core.extract_by_ids).
#
# write: append + options.control_table marca a entidade como incremental por
# arquivo: o transform só põe no bronze o landing ainda não carregado (bronze-delta
# + manifesto) e o load registra o manifesto na tabela de controle, na mesma
# transação do COPY. Vale para o que a API devolve imutável (um voto, uma
# proposição já baixada). Quem não tem isso segue full refresh (write: truncate).
# Ao ligar numa tabela que já tem histórico, rode uma vez:
#   uv run python scripts/controle_semear.py <config.yml> <entidade>
db_schema: "raw_camara"

environments:
  dev:
    base_raw: "${LAKE_ROOT}/raw/demodados/camara"
    base_bronze: "${LAKE_ROOT}/bronze/demodados/camara"
    base_parameters: "${LAKE_ROOT}/raw/demodados/camara/parameters"
  prod:
    base_raw: "/usr/local/airflow/mylake/raw/demodados/camara"
    base_bronze: "/usr/local/airflow/mylake/bronze/demodados/camara"
    base_parameters: "/usr/local/airflow/mylake/raw/demodados/camara/parameters"

sources:
  legislaturas:                  # um JSON por legislatura, com todas as páginas
    base_url: "https://dadosabertos.camara.leg.br/api/v2/deputados?idLegislatura={legislatura}&ordem=ASC&ordenarPor=nome&itens=100"
    subpath: "legislatura"
    landing_file: "{legislatura}_deputados_legislatura.json"
    bronze_file: "legislaturas_deputados.csv"
    db_table: "raw_camara_legislaturas"
    output_param_file:
      id_deputados_legislaturas.csv: "id"
    options:
      legislaturas: [51, 52, 53, 54, 55, 56, 57]

  deputados:
    base_url: "https://dadosabertos.camara.leg.br/api/v2/deputados/{id}"
    subpath: "deputados"
    landing_file: "{id}_deputado.json"
    bronze_file: "parlamento_deputados.csv"
    db_table: "raw_camara_deputados"
    parameter_file: "id_deputados.csv"   # atuais (_params/atualizar_deputados): sempre rebaixados
    options:
      workers: 4
      historico_file: "id_deputados_legislaturas.csv"   # de legislaturas: só os que faltam no landing

  votacoes:
    base_url: "https://dadosabertos.camara.leg.br/api/v2/votacoes"
    subpath: "votacoes"
    bronze_file: "camara_votacoes.csv"
    db_table: "raw_camara_votacoes"
    options:
      trimestres: 2               # o corrente e o anterior: fecha o que entrou depois da última execução
    output_param_file:
      id_votacoes.csv: "id"
      id_proposicao.csv: "id_proposicao"

  votos_deputados:
    base_url: "https://dadosabertos.camara.leg.br/api/v2/votacoes/{id}/votos"
    subpath: "votos_deputados"
    landing_file: "{id}_votos_deputados.json"
    bronze_file: "camara_votos_deputados.csv"
    db_table: "raw_camara_votos_deputados"
    parameter_file: "id_votacoes.csv"
    write: append                 # incremental: um JSON por votação, imutável
    options:
      no_data_file: "sem_dados_id_votacao.csv"
      control_table: "ingestion_control"

  votos_orientacao:
    base_url: "https://dadosabertos.camara.leg.br/api/v2/votacoes/{id}/orientacoes"
    subpath: "votos_orientacao"
    landing_file: "{id}_votacoes_orientacao.json"
    bronze_file: "camara_votos_orientacao.csv"
    db_table: "raw_camara_votacoes_orientacao"
    parameter_file: "id_votacoes.csv"
    options:
      no_data_file: "sem_dados_id_votacao_orientacao.csv"
      blacklist_on_error: false   # timeout não entra na lista (diverge dos demais)

  proposicao_tema:
    base_url: "https://dadosabertos.camara.leg.br/api/v2/proposicoes/{id}/temas"
    subpath: "proposicao_tema"
    landing_file: "{id}_proposicao_tema.json"
    bronze_file: "camara_proposicao_tema.csv"
    db_table: "raw_camara_proposicao_tema"
    parameter_file: "id_proposicao.csv"
    write: append                 # incremental: um JSON por proposição
    options:
      parameter_column: "id_proposicao"
      no_data_file: "sem_dados_id_proposicao_tema.csv"
      control_table: "ingestion_control"

  proposicao:
    base_url: "https://dadosabertos.camara.leg.br/api/v2/proposicoes/{id}"
    subpath: "proposicao"
    landing_file: "{id}_proposicao.json"
    bronze_file: "camara_proposicao.csv"
    db_table: "raw_camara_proposicao"
    parameter_file: "id_proposicao.csv"
    write: append                 # incremental: um JSON por proposição
    options:
      parameter_column: "id_proposicao"
      no_data_file: "sem_dados_id_proposicao.csv"
      control_table: "ingestion_control"

  # Arquivos anuais (dadosabertos.camara.leg.br/arquivos): TODAS as proposições,
  # não só as votadas. Formato do arquivo, diferente da API por ID
  # (ultimoStatus.* em vez de statusProposicao.*), por isso em tabela própria.
  # Todos os anos são rebaixados a cada execução: o status de proposição antiga muda.
  arquivo_proposicoes:
    base_url: "https://dadosabertos.camara.leg.br/arquivos/proposicoes/json/proposicoes-{ano}.json"
    subpath: "arquivos/proposicoes"
    landing_file: "proposicoes-{ano}.json"
    bronze_file: "camara_arquivo_proposicoes.csv"
    db_table: "arquivo_proposicoes"
    options:
      ano_inicio: 1934            # primeiro ano com arquivo

  arquivo_proposicoes_temas:
    base_url: "https://dadosabertos.camara.leg.br/arquivos/proposicoesTemas/json/proposicoesTemas-{ano}.json"
    subpath: "arquivos/proposicoes_temas"
    landing_file: "proposicoesTemas-{ano}.json"
    bronze_file: "camara_arquivo_proposicoes_temas.csv"
    db_table: "arquivo_proposicoes_temas"
    options:
      ano_inicio: 1945            # primeiro ano com arquivo
