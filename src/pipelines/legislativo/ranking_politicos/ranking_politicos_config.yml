# Schema destino de todas as tabelas deste arquivo (tabela = entidade).
# landing_file usa {year}: um JSON por ano, todos concatenados no bronze.
db_schema: "raw_ranking_politicos"

environments:
  dev:
    base_raw: "${LAKE_ROOT}/raw/demodados/ranking"
    base_bronze: "${LAKE_ROOT}/bronze/demodados/ranking"
  prod:
    base_raw: "/usr/local/airflow/mylake/raw/demodados/ranking"
    base_bronze: "/usr/local/airflow/mylake/bronze/demodados/ranking"

sources:
  deputados:
    base_url: "https://ranking.org.br/api/filter-items-ranking?page=1&per_page=1000000&current_tab=0&cargo_id=1&ordem=desc&ordenar_por=pontuacao"
    subpath: "deputados"
    landing_file: "ranking_deputados_{year}.json"
    bronze_file: "ranking_deputados.csv"
    db_table: "deputados"
  senadores:
    base_url: "https://ranking.org.br/api/filter-items-ranking?page=1&per_page=1000000&current_tab=0&cargo_id=2&ordem=desc&ordenar_por=pontuacao"
    subpath: "senadores"
    landing_file: "ranking_senadores_{year}.json"
    bronze_file: "ranking_senadores.csv"
    db_table: "senadores"
