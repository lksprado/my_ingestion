# Fonte: OpenWeather One Call 3.0 — day_summary (resumo diário de um ponto).
# Landing e bronze ficam no mesmo staging (um JSON por dia + all_dfs.csv com ","):
# o Airflow lê o CSV, faz o upsert em raw_openweather.openweather_daily e move os
# JSONs para bronze/weather_project — por isso load: none e o caminho antigo.
# ``{day}`` em landing_file é resolvido pelo pipeline (data requisitada).
db_schema: "raw_openweather"
load: none
bronze_sep: ","

environments:
  dev:
    base_raw: "${LAKE_ROOT}/staging/weather_project"
    base_bronze: "${LAKE_ROOT}/staging/weather_project"
  prod:
    base_raw: "/usr/local/airflow/mylake/staging/weather_project"
    base_bronze: "/usr/local/airflow/mylake/staging/weather_project"

sources:
  daily:
    base_url: "https://api.openweathermap.org/data/3.0/onecall/day_summary"
    landing_file: "day_summary_{day}.json"
    bronze_file: "all_dfs.csv"
    db_table: "openweather_daily"          # high-water mark: MAX(options.date_column)
    options:
      lat: -23.137                         # Atibaia/SP
      lon: -46.5547861
      control_file: "missing_dates.csv"
      date_column: "date"
