# Fonte: portal apsystemsema.com (login via Selenium, relatório horário via AJAX).
# Padrão das demais fontes: o landing acumula um JSON por dia, cada entidade
# reconstrói seu bronze a partir dele e a carga é full refresh (write: truncate,
# o default). O que evita rebaixar o histórico é o extract, incremental por data
# (high-water mark nas próprias tabelas), não a carga.
# Schema raw_apsystem preservado: é o que o my_analytics lê.
# bronze_sep "," é o formato histórico destes CSVs; nada fora daqui os lê.
# ``{day}`` em landing_file é resolvido pelo pipeline (data requisitada).
#
# Ordem: solar_daily_energy (extract + transform) e depois solar_hourly_energy
# (só transform, lê o mesmo landing).
db_schema: "raw_apsystem"
bronze_sep: ","
options:
  control_file: "missing_dates.csv"
  # tabelas do high-water mark e sua coluna de data: o extract parte do menor MAX
  watermarks:
    solar_daily_energy: "date"
    solar_hourly_energy: "datetime"
  # equipment_id do inversor vem do .env (APSYSTEMS_EQUIPMENT_ID)
  login_url: "https://apsystemsema.com/ema/index.action"
  report_url: "https://apsystemsema.com/ema/ajax/getReportApiAjax/getHourlyEnergyOnCurrentDayAjax"
  headless: false

environments:
  dev:
    base_raw: "${LAKE_ROOT}/raw/solar_project"
    base_bronze: "${LAKE_ROOT}/bronze/solar_project"
  prod:
    base_raw: "/usr/local/airflow/mylake/raw/solar_project"
    base_bronze: "/usr/local/airflow/mylake/bronze/solar_project"

sources:
  daily_energy:
    landing_file: "hourly24_production_{day}.json"
    bronze_file: "daily_energy.csv"
    db_table: "solar_daily_energy"

  hourly_energy:                       # sem extract: usa o landing de daily_energy
    landing_file: "hourly24_production_{day}.json"
    bronze_file: "hourly_energy.csv"
    db_table: "solar_hourly_energy"
