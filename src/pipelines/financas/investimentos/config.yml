# Abas do Google Sheets a ingerir (carga bruta, agnostica a colunas), por planilha.
# Escalar = adicionar uma chave/item aqui; nenhuma coluna eh listada, apenas nome + offset.
#
# header_row: indice 0-based da linha de cabecalho em worksheet.get_all_values().
# Chave do workbook -> env var com a URL, por convencao: URL_FINANCE_<CHAVE_MAIUSCULA>.
# O PRIMEIRO workbook eh o primario: suas abas viram google_<aba>.csv -> raw.<aba>.
# Os demais recebem sufixo da chave: google_<aba>_<chave>.csv -> raw.<aba>_<chave>.
sheets:
  lucas_jessica:
    - name: LUC-Consolidado
      header_row: 3
    - name: JSC-Consolidado
      header_row: 3
    - name: LUC-Contas
      header_row: 4
    - name: JSC-Contas
      header_row: 4
    - name: Luz
      header_row: 0
    - name: Patrimonio
      header_row: 5
    - name: Carteira-Classificacao
      header_row: 0
    - name: Ajuste
      header_row: 34
  deusa:
    - name: Patrimonio
      header_row: 0
