repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      # main é produção: toda mudança entra por branch + PR. A proteção de
      # verdade é a do GitHub; este hook só avisa antes do commit.
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # Estrutura dos <fonte>_config.yml: chave desconhecida, load/write inválido,
  # ambiente faltando, schema sem raw_, sources x ETLS. Ver scripts/validar_configs.py.
  - repo: local
    hooks:
      - id: validar-configs-pipeline
        name: valida os <fonte>_config.yml dos pipelines
        entry: uv run --no-sync python scripts/validar_configs.py
        language: system
        files: ^src/pipelines/.*(_config\.yml|_etl\.py)$
